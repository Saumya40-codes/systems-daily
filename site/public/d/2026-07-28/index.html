<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<title>CLI provider smoke test</title>
<style>

:root {
  color-scheme: light dark;
  --fg: #1a1a1a;
  --muted: #555;
  --bg: #fafafa;
  --border: #ddd;
  --code-bg: #f0f0f0;
  --pre-bg: #f4f4f4;
  --link: #1a1a1a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fg: #e8e8e8;
    --muted: #aaa;
    --bg: #121212;
    --border: #333;
    --code-bg: #1e1e1e;
    --pre-bg: #1a1a1a;
    --link: #e8e8e8;
  }
}
* { box-sizing: border-box; }
html { font-size: 17px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  line-height: 1.55;
}
main {
  max-width: 40rem;
  margin: 0 auto;
  padding: 1.5rem 1.1rem 3rem;
}
header.meta {
  border-bottom: 1px solid var(--border);
  padding-bottom: 0.75rem;
  margin-bottom: 1.5rem;
}
.brand {
  margin: 0 0 0.25rem;
  font-size: 0.8rem;
  letter-spacing: 0.04em;
  text-transform: lowercase;
  color: var(--muted);
}
.line {
  margin: 0;
  font-size: 0.9rem;
  color: var(--muted);
}
.cat { text-transform: lowercase; }
article h1 {
  font-size: 1.45rem;
  font-weight: 650;
  line-height: 1.25;
  margin: 0 0 1rem;
}
article h2 {
  font-size: 1.1rem;
  font-weight: 650;
  margin: 1.6rem 0 0.6rem;
}
article h3 {
  font-size: 1rem;
  font-weight: 650;
  margin: 1.25rem 0 0.5rem;
}
article p { margin: 0.7rem 0; }
article ul, article ol { padding-left: 1.25rem; }
article li { margin: 0.25rem 0; }
article a { color: var(--link); text-decoration: underline; text-underline-offset: 2px; }
article code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.88em;
  background: var(--code-bg);
  padding: 0.1em 0.3em;
  border-radius: 3px;
}
article pre {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.82rem;
  line-height: 1.4;
  background: var(--pre-bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 0.75rem 0.85rem;
  overflow-x: auto;
  margin: 1rem 0;
}
article pre code {
  background: none;
  padding: 0;
  font-size: inherit;
}
article svg {
  display: block;
  max-width: 100%;
  height: auto;
  margin: 1rem 0;
}
article blockquote {
  margin: 0.8rem 0;
  padding-left: 0.9rem;
  border-left: 3px solid var(--border);
  color: var(--muted);
}
footer {
  margin-top: 2.5rem;
  padding-top: 0.75rem;
  border-top: 1px solid var(--border);
  font-size: 0.85rem;
  color: var(--muted);
}
footer a { color: var(--muted); }

</style>
</head>
<body>
<main>
<header class="meta">
<p class="brand">systems-daily</p>
<p class="line"><span class="cat">embedded</span> · <time datetime="2026-07-28">2026-07-28</time></p>
</header>
<article>
<h1>CLI provider smoke test</h1>
<p>Replace <code>scripts/example-llm-cli.sh</code> with a real completer.</p>
<pre>pipeline works</pre>
</article>
<footer>
<p><a href="/today/">today</a></p>
</footer>
</main>
</body>
</html>
